name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Sur une pull request, un nouveau push annule l'analyse en cours. Sur main,
# jamais : interrompre un déploiement en plein « terraform apply » laisserait
# l'infrastructure dans un état intermédiaire.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: password-checker:${{ github.sha }}

# Actions tierces figées par empreinte de commit (SHA) et non par tag :
# un tag peut être déplacé vers du code malveillant, un SHA non.
# Outils figés par version : un résultat de scan est reproductible.

jobs:
  # ---------------------------------------------------------------------------
  # Analyse du code source
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install flake8==7.5.0
      - run: flake8 app/ tests/

  unit-tests:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install -r app/app/requirements.txt pytest==9.2.0
      - run: pytest tests/unit -v

  sast-bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install bandit==1.9.4
      - run: bandit -r app/

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/python --config p/flask --error app/

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r app/app/requirements.txt

  # Secrets (clés, jetons, mots de passe) dans TOUT l'historique Git : un
  # secret supprimé du code reste lisible dans les anciens commits.
  secrets:
    name: Secrets (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet, pas seulement le dernier commit
      # --results=verified,unverified,unknown : un secret non vérifiable (ou
      # qu'AWS, GitHub... n'ont pas pu confirmer) bloque aussi la pipeline.
      # safe.directory : le dépôt monté appartient à l'utilisateur du runner,
      # pas à root, l'utilisateur du conteneur.
      - name: Secrets dans tout l'historique Git
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          trufflesecurity/trufflehog:3.99.8
          git file:///repo --no-update --fail --results=verified,unverified,unknown

  # ---------------------------------------------------------------------------
  # Image Docker : lint, construction, tests, analyses de sécurité
  # ---------------------------------------------------------------------------
  dockerfile-lint:
    name: Lint Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

  build:
    name: Build (image Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull --no-cache -t "$IMAGE" .
      - run: docker save "$IMAGE" -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  image-test:
    name: Tests du conteneur
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: docker load -i image.tar
      - run: bash tests/container/smoke_test.sh "$IMAGE"

  image-trivy:
    name: Scan image (Trivy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Vulnérabilités HIGH et CRITICAL corrigeables
        run: >
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.76.2
          image --input /work/image.tar
          --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --no-progress

  image-dockle:
    name: Scan image (Dockle)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      # DKL-DI-0005 ignorée (faux positif) : la couche signalée est celle de
      # l'image officielle Python, qui vide le cache apt avec
      # « apt-get dist-clean », commande que Dockle v0.4.15 ne reconnaît pas.
      # L'absence de cache apt est vérifiée par tests/container/smoke_test.sh.
      - name: Bonnes pratiques (CIS Docker Benchmark)
        run: >
          docker run --rm -v "$PWD:/work" goodwithtech/dockle:v0.4.15
          --input /work/image.tar
          --ignore DKL-DI-0005
          --exit-code 1 --exit-level warn

  # ---------------------------------------------------------------------------
  # Infrastructure as Code (Terraform)
  # ---------------------------------------------------------------------------
  iac-terraform:
    name: IaC Terraform (fmt, validate, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Aucun identifiant AWS : init sans backend, tests avec fournisseur
      # simulé. Les fournisseurs téléchargés sont vérifiés par les empreintes
      # du fichier .terraform.lock.hcl versionné.
      - name: Format, validation et tests de chaque module
        run: >
          docker run --rm -v "$PWD:/w" -w /w/infra
          --entrypoint sh hashicorp/terraform:1.17.1 -c '
          set -e;
          terraform fmt -check -recursive -diff;
          for d in */; do
          echo "== $d";
          terraform -chdir="$d" init -backend=false -input=false -lockfile=readonly;
          terraform -chdir="$d" validate;
          terraform -chdir="$d" test;
          done'

  iac-checkov:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Chaque exception (#checkov:skip) est justifiée dans le code Terraform
      # et dans le README, et couverte par un test terraform test.
      - name: Mauvaises configurations de l'infrastructure
        run: >
          docker run --rm -v "$PWD:/w" -w /w bridgecrew/checkov:3.4.4
          -d infra --framework terraform --compact

  # ---------------------------------------------------------------------------
  # Déploiement continu (main uniquement) puis analyse dynamique
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (AWS)
    # Uniquement après la réussite de TOUS les contrôles ci-dessus, et
    # uniquement sur main (jamais depuis une pull request).
    needs:
      - lint
      - unit-tests
      - sast-bandit
      - sast-semgrep
      - sca
      - dockerfile-lint
      - build
      - image-test
      - image-trivy
      - image-dockle
      - iac-terraform
      - iac-checkov
      - secrets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environnement GitHub protégé : approbation manuelle avant chaque
    # déploiement ; les identifiants AWS n'existent que dans cet environnement.
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    # Un seul déploiement à la fois, jamais annulé en cours de route.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      # Identifiants temporaires du Learner Lab (OIDC interdit dans le lab),
      # à renouveler à chaque session. Masqués dans les journaux par GitHub.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identifiants AWS valides
        run: |
          aws sts get-caller-identity >/dev/null || {
            echo "::error::Identifiants AWS invalides ou expirés : recoller ceux du lab dans l'environnement production."
            exit 1
          }

      # L'image envoyée est celle construite, testée et analysée par les jobs
      # précédents (artefact), et non une nouvelle construction.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Image envoyée dans ECR (tag = SHA du commit)
        run: |
          docker load -i image.tar
          repo="$(aws ecr describe-repositories --repository-names password-checker \
            --query 'repositories[0].repositoryUri' --output text)"
          registry="${repo%%/*}"
          if aws ecr describe-images --repository-name password-checker \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG déjà présente (tags immuables)."
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
            docker tag "$IMAGE" "$repo:$TAG"
            docker push "$repo:$TAG"
            docker logout "$registry"
          fi

      - name: Terraform (plan puis apply du plan)
        run: >
          docker run --rm -v "$PWD:/w" -w /w/infra/platform
          -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN
          -e AWS_REGION -e TF_STATE_BUCKET -e TAG -e TF_IN_AUTOMATION=1
          --entrypoint sh hashicorp/terraform:1.17.1 -c '
          set -e;
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET";
          terraform plan -input=false -var "image_tag=$TAG" -out=tfplan;
          terraform apply -input=false tfplan;
          rm -f tfplan'

      - name: Attente de la stabilité du service ECS
        run: aws ecs wait services-stable --cluster password-checker --services password-checker

      - name: Image en service = image du commit
        run: |
          td="$(aws ecs describe-services --cluster password-checker --services password-checker \
            --query 'services[0].taskDefinition' --output text)"
          image="$(aws ecs describe-task-definition --task-definition "$td" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)"
          [ "${image##*:}" = "$TAG" ] || { echo "::error::image en service : ${image##*:}, attendue : $TAG"; exit 1; }

      - name: Adresse publique
        id: url
        run: |
          url="$(docker run --rm -v "$PWD:/w" -w /w/infra/platform \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
            hashicorp/terraform:1.17.1 output -raw url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # -k : certificat auto-signé (pas de nom de domaine dans le lab).
      - name: Application en ligne (HTTPS)
        env:
          URL: ${{ steps.url.outputs.url }}
        run: curl -fsSk --retry 10 --retry-delay 10 --retry-all-errors -o /dev/null "$URL/"

  dast:
    name: DAST (OWASP ZAP)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scan passif (baseline) de l'application en ligne : en-têtes, cookies,
      # divulgation d'informations... Tout avertissement fait échouer le job,
      # sauf les règles ignorées avec justification dans .zap/rules.tsv.
      #
      # Le robot de ZAP envoie des requêtes sans User-Agent, que le WAF bloque
      # (règle AWS NoUserAgent_HEADER) : ZAP analyserait alors la page 403 du
      # WAF au lieu de l'application. Une règle « Replacer » de ZAP ajoute un
      # User-Agent identifiable à toutes ses requêtes ; le WAF reste inchangé.
      - name: Analyse dynamique de l'application déployée
        env:
          URL: ${{ needs.deploy.outputs.url }}
          UA: DevSecOps-Project-DAST/1.0
        run: |
          # Garde-fou 1 : le WAF laisse passer le scanner identifié.
          code="$(curl -sk -A "$UA" -o /dev/null -w '%{http_code}' "$URL/login")"
          [ "$code" = "200" ] || { echo "::error::le WAF bloque le scanner (code $code)"; exit 1; }

          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R a+rwx zap
          r="replacer.full_list(0)"
          set +e
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" zaproxy/zap-stable:2.17.0 \
            zap-baseline.py -t "$URL" -c rules.tsv -r rapport-zap.html -J rapport-zap.json \
            -z "-config $r.description=ua -config $r.enabled=true -config $r.matchtype=REQ_HEADER -config $r.matchstr=User-Agent -config $r.regex=false -config $r.replacement=$UA" \
            | tee zap/sortie.txt
          status="${PIPESTATUS[0]}"
          set -e

          # Garde-fou 2 : aucune page analysée n'est une page de blocage du WAF.
          if grep -q "(403 Forbidden)" zap/sortie.txt; then
            echo "::error::ZAP a analysé des pages bloquées par le WAF (403) au lieu de l'application"
            exit 1
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapport-zap
          path: zap/rapport-zap.*
          retention-days: 30
