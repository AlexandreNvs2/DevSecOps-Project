# Mises à jour automatiques proposées par Dependabot (une PR par mise à jour,
# soumise aux mêmes checks obligatoires que le reste du code).
version: 2
updates:
  - package-ecosystem: pip
    directory: /app/app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Fournisseurs Terraform (le fichier .terraform.lock.hcl est mis à jour
  # avec les nouvelles empreintes).
  - package-ecosystem: terraform
    directories:
      - /infra/*
    schedule:
      interval: weekly
