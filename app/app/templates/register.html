{% extends "base.html" %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
  <h1>Créer un compte</h1>
  <form action="{{ url_for('register') }}" method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label for="username">Identifiant</label><br>
      <input type="text" id="username" name="username" required
             minlength="3" maxlength="32" pattern="[a-z0-9_.\-]+"></p>
    <p><label for="password">Mot de passe (12 caractères minimum)</label><br>
      <input type="password" id="password" name="password" required
             minlength="12" maxlength="128" autocomplete="new-password"></p>
    <p><label for="password_confirm">Confirmation</label><br>
      <input type="password" id="password_confirm" name="password_confirm"
             required minlength="12" maxlength="128"
             autocomplete="new-password"></p>
    <p><input type="submit" value="Créer le compte"></p>
  </form>
{% endblock %}
