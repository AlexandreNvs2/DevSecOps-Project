<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Password check</title>
</head>
<body>
  <form action="{{ url_for('password') }}" method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label for="password">Enter your password :</label></p>
    <p><input type="password" id="password" name="password" required maxlength="128"></p>
    <p><input type="submit" value="submit"></p>
  </form>
</body>
</html>
