<svg xmlns="http://www.w3.org/2000/svg" width="680" height="676" viewBox="0 0 680 676" role="img" aria-labelledby="t d">
<title id="t">Architecture AWS de l'application</title>
<desc id="d">Internet passe par le WAF puis l'ALB en HTTPS dans le sous-réseau public, vers deux tâches ECS Fargate privées sur deux zones, qui accèdent à la base RDS PostgreSQL privée sans route Internet. La passerelle NAT ne sert qu'aux sorties. ECR, Secrets Manager, CloudWatch et KMS sont hors du VPC.</desc>
